services:
  flask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hbnb-flask
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-hbnb}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-hbnb}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/api/v1/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:9.6.0
    container_name: hbnb-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-hbnb}"
      MYSQL_USER: "${MYSQL_USER:-hbnb}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # SQLite is embedded and has no server process or network port. Use this
  # service when you need the pinned SQLite CLI against the shared DB file:
  # docker compose run --rm sqlite3 /data/hbnb.sqlite3
  sqlite3:
    image: keinos/sqlite3:3.51.0
    container_name: hbnb-sqlite
    profiles:
      - sqlite-tools
    user: "0:0"
    entrypoint: ["/sbin/tini", "-g", "--", "/usr/bin/sqlite3"]
    command: ["/data/hbnb.sqlite3"]
    volumes:
      - ./data/sqlite:/data
    stdin_open: true
    tty: true
