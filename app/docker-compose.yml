services:
  flask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hbnb-flask
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Development uses a SQLite database persisted on the host.
      DATABASE_URL: "sqlite:////data/hbnb.sqlite3"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
    volumes:
      - ./data/sqlite:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/api/v1/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SQLite is embedded and has no server process or network port. Use this
  # service when you need the pinned SQLite CLI against the shared DB file:
  # docker compose run --rm sqlite3 /data/hbnb.sqlite3
  sqlite3:
    image: keinos/sqlite3:3.51.0
    container_name: hbnb-sqlite
    profiles:
      - sqlite-tools
    user: "0:0"
    entrypoint: ["/sbin/tini", "-g", "--", "/usr/bin/sqlite3"]
    command: ["/data/hbnb.sqlite3"]
    volumes:
      - ./data/sqlite:/data
    stdin_open: true
    tty: true
