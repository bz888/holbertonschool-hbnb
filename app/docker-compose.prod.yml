services:
  flask:
    environment:
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-hbnb}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-hbnb}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:9.6.0
    container_name: hbnb-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-hbnb}"
      MYSQL_USER: "${MYSQL_USER:-hbnb}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
