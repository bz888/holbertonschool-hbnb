<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View details, amenities, and guest reviews for an HBNB place.">
    <title>HBNB | Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="index.html" aria-label="HBNB home">
                <img class="logo" src="images/logo.png" alt="HBNB logo">
            </a>
            <div class="nav-links">
                <a class="nav-link" href="index.html">Places</a>
                <a class="login-button" href="login.html">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <article id="place-details" class="place-details">
            <p class="places-message" role="status" aria-live="polite">Loading place details…</p>
        </article>

        <section id="reviews" class="reviews-section" aria-labelledby="reviews-heading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Guest feedback</p>
                    <h2 id="reviews-heading">Reviews</h2>
                </div>
                <a id="add-review-link" class="details-button" href="add_review.html" data-auth-only hidden>Add a Review</a>
            </div>

            <div id="reviews-list">
                <p class="places-message" role="status" aria-live="polite">Loading reviews…</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBNB. All rights reserved.</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
