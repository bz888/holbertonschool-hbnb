<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse unique places to stay with HBNB.">
    <title>HBNB | Places</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="places">
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="index.html" aria-label="HBNB home">
                <img class="logo" src="images/logo.png" alt="HBNB logo">
            </a>
            <div class="nav-links">
                <a class="nav-link active" href="index.html" aria-current="page">Places</a>
                <a class="nav-link" href="add_place.html" data-auth-only hidden>Add Place</a>
                <a id="login-link" class="login-button" href="login.html">Login</a>
                <button class="logout-button" type="button" data-auth-only hidden>Logout</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero" aria-labelledby="places-heading">
            <p class="eyebrow">Find your next stay</p>
            <h1 id="places-heading">Explore our places</h1>
            <p>Comfortable homes, memorable locations, and everything you need for a great trip.</p>
        </section>

        <section class="filter" aria-label="Filter places by price">
            <label for="price-filter">Maximum price</label>
            <select id="price-filter" name="price-filter">
                <option value="10">Up to $10</option>
                <option value="50">Up to $50</option>
                <option value="100">Up to $100</option>
                <option value="all" selected>All prices</option>
            </select>
        </section>

        <section id="places-list" class="places-grid" aria-label="Available places">
            <p class="places-message" role="status">Loading places…</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBNB. All rights reserved.</p>
    </footer>
    <script type="module" src="js/app.js"></script>
</body>
</html>
