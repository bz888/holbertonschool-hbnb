<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a review for a place on HBNB.">
    <title>HBNB | Add Review</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="index.html" aria-label="HBNB home">
                <img class="logo" src="images/logo.png" alt="HBNB logo">
            </a>
            <div class="nav-links">
                <a class="nav-link" href="index.html">Places</a>
                <a class="nav-link" href="add_place.html" data-auth-only hidden>Add Place</a>
                <a class="login-button" href="login.html">Login</a>
                <button class="logout-button" type="button" data-auth-only hidden>Logout</button>
            </div>
        </nav>
    </header>

    <main class="centered-page">
        <section id="add-review" class="form-panel add-review" aria-labelledby="review-heading">
            <p class="eyebrow">Share your experience</p>
            <h1 id="review-heading">Review this place</h1>
            <p class="form-intro">Tell other guests what you enjoyed about your stay.</p>

            <div class="auth-notice" data-auth-guest hidden>
                <p>You must be logged in to add a review.</p>
                <a class="details-button" href="login.html">Go to Login</a>
            </div>

            <form id="review-form" class="form" method="post" data-auth-only hidden>
                <div class="form-group">
                    <label for="review">Your review</label>
                    <textarea id="review" name="review" rows="6" minlength="10" placeholder="Write your review here..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="rating">Rating</label>
                    <select id="rating" name="rating" required>
                        <option value="" disabled selected>Select a rating</option>
                        <option value="5">5 — Excellent</option>
                        <option value="4">4 — Very good</option>
                        <option value="3">3 — Good</option>
                        <option value="2">2 — Fair</option>
                        <option value="1">1 — Poor</option>
                    </select>
                </div>

                <p id="review-message" role="status" aria-live="polite" hidden></p>

                <button class="primary-button" type="submit">Submit Review</button>
                <a id="review-cancel-link" class="text-link" href="index.html">Cancel and return to place</a>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBNB. All rights reserved.</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
